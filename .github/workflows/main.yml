name: CI-CD-Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: CONTINUOUS INTEGRATION
  # ==========================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Code
        run: echo "Linting repository"

      - name: Run Unit Tests
        run: echo "Running unit tests"


  # ==========================================
  # JOB 2: BUILD AND PUSH IMAGE TO AMAZON ECR
  # ==========================================
  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          set -e

          echo "Building Docker image..."

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

          echo "Pushing Docker image to Amazon ECR..."

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Docker image pushed successfully."

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  # ==========================================
  # JOB 3: DEPLOY ON SELF-HOSTED UBUNTU EC2
  # ==========================================
  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Image Exists
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -e

          echo "Checking AWS account..."
          aws sts get-caller-identity

          echo "Checking whether the latest image exists..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION"

      - name: Pull Latest Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          set -e

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Pulling image from Amazon ECR..."

          docker pull "$IMAGE_URI"

          echo "Image pulled successfully."

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Stop and Remove Previous Container
        run: |
          docker rm -f networksecurity 2>/dev/null || true

      - name: Run Docker Container
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
        run: |
          set -e

          echo "Removing old container if it exists..."
          docker rm -f networksecurity || true

          echo "Starting application container..."

          docker run -d \
            --restart unless-stopped \
            -p 8080:8080 \
            --ipc=host \
            --name networksecurity \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e MLFLOW_TRACKING_USERNAME=shushant11 \
            -e MLFLOW_TRACKING_PASSWORD="$DAGSHUB_USER_TOKEN" \
            -e DAGSHUB_USER_TOKEN="$DAGSHUB_USER_TOKEN" \
            "$IMAGE_URI"

          echo "Container started successfully."